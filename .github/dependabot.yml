version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      action-updates:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: "/clickstream-analytics/cdk"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      python-dependencies:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: "/clickstream-analytics/clients/generator"
